<style>:root{--sigc:#1B2A4A;--sigs:#e0b48f;--sigl:#1B2A4A;--sigj:#003DA5;--sigsh:rgba(0,0,0,.1);--blue:#003DA5;--navy:#1B2A4A;--red:#E4002B;--gold:#C8A951;--bg:#F0F2F6;--card:#FFFFFF;--card2:#F7F8FB;--tx:#1a1a1a;--txm:#5b6472;--txl:#9ca3af;--ok:#16a34a;--okbg:#e8f6ee;--err:#dc2626;--errbg:#fdecec;--warn:#ea580c;--warnbg:#fff2e8;--brd:#e5e7eb;--acc:#003DA5;--accbg:#e6edf8;--shadow:0 1px 3px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04);--r:14px}
[data-theme=dark]{--sigc:#c9d4ea;--sigl:#8193b8;--sigj:#3d6fd9;--sigsh:rgba(255,255,255,.08);--bg:#0d1320;--card:#162033;--card2:#1c2840;--tx:#e8ecf3;--txm:#a3adbf;--txl:#6b7690;--brd:#26334d;--okbg:#10301f;--errbg:#3a1518;--warnbg:#3a2412;--accbg:#1a2b4d;--acc:#6f9cff;--shadow:none}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font:inherit;color:var(--tx);background:var(--card);border:1.5px solid var(--brd);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:110px;resize:vertical;line-height:1.45}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--acc)}
.app{max-width:760px;margin:0 auto;padding-bottom:84px;min-height:100vh}
/* header */
.hdr{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;padding:14px 18px 14px;position:relative;overflow:hidden}
.hdr:after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;border:18px solid rgba(255,255,255,.06)}
.hdr-row{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.hdr-logo{width:46px;height:46px;flex:none;object-fit:contain}
.hdr-t{font-weight:800;font-size:17px;letter-spacing:.2px}
.hdr-s{font-size:11.5px;opacity:.78}
.hdr-btn{margin-left:auto;width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.12);display:grid;place-items:center}
.hdr-btn svg{width:20px;height:20px}
.tricolor{height:4px;background:linear-gradient(90deg,var(--blue) 33%,#fff 33% 66%,var(--red) 66%)}
.wrap{padding:16px}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--brd);display:flex;justify-content:center;z-index:20}
.nav-in{display:flex;max-width:760px;width:100%}
.nav button{flex:1;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--txl);font-weight:600}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--acc)}
/* cards */
.card{background:var(--card);border:1px solid var(--brd);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.h1{font-size:21px;font-weight:800;margin-bottom:4px}
.h2{font-size:16px;font-weight:800;margin:20px 0 10px;display:flex;align-items:center;gap:8px}
.h2 small{font-weight:600;color:var(--txl);font-size:12px;margin-left:auto}
.muted{color:var(--txm)}.small{font-size:13px}.tiny{font-size:11.5px}
.row{display:flex;gap:10px;align-items:center}.wrapf{flex-wrap:wrap}
.grow{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:12px;font-weight:700;background:var(--acc);color:#fff;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn.sec{background:var(--accbg);color:var(--acc)}
.btn.ghost{background:transparent;border:1.5px solid var(--brd);color:var(--tx)}
.btn.red{background:var(--red)}.btn.ok{background:var(--ok)}
.btn.block{width:100%}
.btn svg{width:18px;height:18px;flex:none}
#main{padding-bottom:30px}
.btn:disabled{opacity:.45;cursor:default}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--accbg);color:var(--acc)}
.chip.lv{color:#fff}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;background:var(--card2);color:var(--txm);border:1px solid var(--brd)}
/* hero */
.hero{border-radius:18px;padding:18px;color:#fff;position:relative;overflow:hidden;margin-bottom:14px}
.hero .lvl{font-size:12px;font-weight:700;opacity:.9;text-transform:uppercase;letter-spacing:.8px}
.hero .big{font-size:24px;font-weight:800;line-height:1.2;margin:6px 0 2px}
.hero .chg{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.18);color:#fff;padding:6px 10px;border-radius:9px;font-size:12px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{background:rgba(255,255,255,.14);border-radius:12px;padding:10px}
.stat b{display:block;font-size:20px;line-height:1.1}
.stat span{font-size:11.5px;opacity:.85}
.cta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.cta .btn{padding:14px 10px;flex-direction:column;gap:2px;border-radius:14px}
.cta .btn small{font-weight:600;opacity:.8;font-size:11.5px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tile{background:var(--card);border:1px solid var(--brd);border-radius:14px;padding:14px 12px;text-align:left;box-shadow:var(--shadow)}
.tile .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--accbg);color:var(--acc);margin-bottom:8px}
.tile .ic svg{width:19px;height:19px}
.tile b{display:block;font-size:14px}
.tile span{font-size:11.5px;color:var(--txm)}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.mcell{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:14px;border:1px solid var(--brd);position:relative}
.mcell i{position:absolute;bottom:3px;left:5px;right:5px;height:3px;border-radius:2px;background:rgba(0,0,0,.08)}
.mcell i u{display:block;height:100%;border-radius:2px;background:currentColor}
.mrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.mrow button{padding:6px 10px;border-radius:9px;border:1px solid var(--brd);font-size:12px;font-weight:700;background:var(--card)}
.legend{display:flex;gap:12px;font-size:11px;color:var(--txm);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
/* lists */

<script>// Définitions — Règles du Jeu World Rugby 2026 (version 2607), texte officiel

["50:22","Lorsqu'un ballon est botté par un joueur dans sa propre moitié de terrain et qu'il sort indirectement en touche dans les 22 mètres adverses. Le ballon ne doit pas être rentré dans sa moitié de terrain par l'équipe qui a envoyé le ballon en touche.","18.8a"],

["Assistant plaqueur","Un joueur qui aide un coéquipier à amener un porteur de ballon au sol, ou qui tient le porteur du ballon pendant un plaquage, mais qui ne va pas au sol lui-même. Ce joueur est traité selon la règle 14 sur les « autres joueurs ».","14"],
["Au-delà ou derrière ou devant une position","Signifie avec les deux pieds, sauf si le contexte ne permet pas cette interprétation.",""],
["Avantage","Un avantage tactique ou territorial clair et réel survenant après une infraction adverse.","7"],
["Blessure qui saigne","Saignement actif non contrôlé.","3"],
["Botté directement en touche","Le ballon est botté en touche sans avoir rebondi dans l'aire de jeu ou touché un joueur ou l'arbitre.","18"],
["But","Le ballon passe au-dessus de la barre transversale de l'équipe adverse sur un coup de pied placé ou tombé donné à l'intérieur du champ de jeu.","8"],

["Carton jaune","Le carton infligé à un joueur par l'arbitre pour signaler que ce joueur a été averti et temporairement exclu, normalement 10 minutes.","9"],
["Carton rouge","Le carton infligé à un joueur par l'arbitre pour signaler que ce joueur a été définitivement exclu du match.","9"],
["Champ de jeu","L'aire comprise entre les lignes de but et les lignes de touche. Ces lignes ne font pas partie du champ de jeu.","1"],
["Coéquipier","Un autre joueur de la même équipe.",""],
["Coin volant","Un type d'attaque interdit, qui se produit généralement près de la ligne d'essai, soit sur une pénalité, un coup franc ou dans le jeu courant. Plusieurs coéquipiers sont pré-liés à un porteur de ballon dynamique, parfois dans une formation en V avant d'initier un contact avec l'adversaire. Souvent, un ou plusieurs de ces coéquipiers se trouvent devant le porteur du ballon. Un seul joueur pré-lié est autorisé à condition que ce joueur remplisse ses obligations en tant que joueur se joignant à un plaquage.","9.22"],

["Coup de pied","Une action effectuée en frappant délibérément le ballon avec une partie de la jambe ou du pied, talon exclu, des orteils au genou, mais genou exclu. Un coup de pied doit déplacer le ballon sur une distance visible par rapport à la main ou le long du sol.",""],

["Cravate","Un plaquage illégal dans le cadre duquel un joueur utilise un bras tendu pour frapper le porteur du ballon.","9"],

["Marque de la touche (la)","Une ligne imaginaire dans le champ de jeu qui forme un angle droit avec la ligne de touche et passe par le point d'où le ballon est lancé. La marque de la touche ne peut pas être à moins de cinq mètres d'une ligne d'essai.","18"],

["Renvoi","La méthode pour reprendre le jeu par un drop lors d'un renvoi aux 22 mètres, d'un renvoi sur la ligne d'essai, ou au centre du terrain après des points marqués. Une pénalité ou un coup franc n'est pas un renvoi.","12"],

["Sin Bin (zone d'exclusion temporaire)","L'endroit désigné hors de l'aire de jeu où doit rester un joueur temporairement suspendu.","9"],
["Sous-short","Un sous-vêtement qui couvre le corps de la taille, est court ou sans jambe et se termine au-dessus des genoux, et est porté sur la peau ou sous la tenue et n'est pas attaché au maillot ni au short.","4"],
["Sur ses pieds","Un joueur est sur ses pieds si aucune autre partie de son corps ne s'appuie sur le sol ou sur des joueurs au sol.","13"],
["Tee","Tout équipement approuvé par l'organisateur du match pour soutenir le ballon lors d'un coup de pied placé.","8"],

["Temps de jeu réel","Le temps de jeu écoulé incluant les arrêts de jeu.","5"],

["Terrain de jeu","La totalité de l'aire indiquée dans le diagramme du terrain à la Règle 1.","1"],
["Touche","L'aire située le long du champ de jeu qui inclut les lignes de touche et l'espace au-delà de ces lignes.","18"],
["Touche de but","L'aire située le long de la zone d'en-but qui inclut les lignes de touche de but et l'espace au-delà de ces lignes.","18"],
["Touche rapide","Voir Remise en jeu rapide.","18"],

R17:["Marque : au moins un pied sur ou derrière sa ligne des 22 m, réception de volée d'un coup de pied adverse ayant atteint le plan des 22, crier « Marque ».",
"Possible si le ballon touche un poteau/la barre. Impossible sur coup d'envoi ou renvoi après score.",

R18:["Touche : ballon non tenu touchant la ligne ou au-delà ; porteur touchant la ligne ou le sol au-delà ; joueur en touche qui attrape (selon le plan de la ligne).",

"50:22 : botté de sa moitié, indirectement en touche dans les 22 adverses → lancer pour l'équipe du botteur.",
"Alignement : 2 joueurs mini par équipe, 0,5 m de chaque côté de la ligne, entre 5 et 15 m ; formé en 30 s (CF) ; opposant au lanceur à 2 m de la marque et des 5 m ; relayeur à 2 m.",
"Lancer : droit, 5 m mini ; pas droit vers un joueur : jeu continue si l'adversaire ne soulève pas, sinon option alignement/mêlée.",
"Non-participants : 10 m de la ligne de remise en jeu ou ligne d'essai.","Fin : ballon quitte l'alignement, entre dans les 5 m, dépasse les 15 m ; ruck/maul au-delà de la ligne ; injouable."],
R19:["Mêlée : dans la zone de mêlée (≥ 5 m des touches et lignes d'essai). Formée dans les 30 s (CF).",
"8 joueurs ; jamais moins de 5. Commandements World Rugby : « flexion », « liez », « jeu ». FFR C/C' : « flexion », « liez », « placement », pas de pied frein.",
"Introduction : droite, d'un seul mouvement, sans délai ; la mêlée commence quand le ballon quitte les mains du demi.",
"Talonneur de l'équipe qui introduit doit talonner (CF). Pas de talonnage à deux pieds (P).",
"Reformation (même introduction) : ballon sorti du tunnel, mêlée effondrée/relevée, tournée > 90°, pas de possession.",
"Hors-jeu : demi non introducteur près sans dépasser la ligne médiane du tunnel ; autres à 5 m du dernier pied.",
"Fin : ballon sorti ailleurs que le tunnel, ramassé par le dernier joueur, faute sifflée, ballon sur/au-delà de la ligne d'essai.",
"M19 : 3-4-1, pas de rotation volontaire, 1,5 m de poussée, ballon non conservé. FFR C : poussée pour le gain uniquement ; C' : 1,5 m."],
R20:["Marque toujours dans le champ de jeu, jamais à moins de 5 m d'une ligne d'essai.",

"Adversaires : 10 m ou leur ligne d'essai ; retard/obstruction : avancée de 10 m.",
"Coup franc : les adversaires peuvent charger dès que le botteur s'élance ; coup franc empêché → mêlée pour l'adversaire."],
R21:["Touché à terre : ballon tenu au contact du sol, ou pression vers le bas (main, bras, avant du corps entre taille et cou).",

SEC:["Processus contact à la tête (HCP) : protège la tête, le cou et la gorge.","Applicable : plaquage haut, charge tête/épaule, déblayage dangereux, tête contre tête, charge coude/avant-bras en avant.",

function ik(S,E0,H){const dx=H[0]-S[0],dy=H[1]-S[1];let d=Math.hypot(dx,dy);const ux=dx/d,uy=dy/d;
  if(d>=LU+LF-0.01){const e=[S[0]+ux*LU,S[1]+uy*LU];return[e,[S[0]+ux*(LU+LF),S[1]+uy*(LU+LF)]];}
  if(d<Math.abs(LU-LF)+1){d=Math.abs(LU-LF)+1;}
  const a=(LU*LU-LF*LF+d*d)/(2*d),h=Math.sqrt(Math.max(0,LU*LU-a*a));const px=S[0]+ux*a,py=S[1]+uy*a;
  const c1=[px-uy*h,py+ux*h],c2=[px+uy*h,py-ux*h];const pick=Math.hypot(c1[0]-E0[0],c1[1]-E0[1])<=Math.hypot(c2[0]-E0[0],c2[1]-E0[1])?c1:c2;
  return[pick,[S[0]+ux*d,S[1]+uy*d]];}
function rotP(p,ang,c){const r=ang*Math.PI/180,x=p[0]-c[0],y=p[1]-c[1];return[c[0]+x*Math.cos(r)-y*Math.sin(r),c[1]+x*Math.sin(r)+y*Math.cos(r)];}

function limb(a,b,w,c,cd){return seg(a,b,w+1.8,cd)+seg(a,b,w,c);}

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const pick=(a,n)=>shuffle(a).slice(0,n);

// ---------- Construction des questions ----------
const QS=[];
for(const k in QRAW){QRAW[k].forEach((x,i)=>{
  const o={id:k+'-'+i,r:k,t:x[0],l:x[1],q:x[2]};
  if(o.t==='sigq'){const s=SIGBY[x[2]];const opts=shuffle([x[2],...pick(x[3],3)]);o.t='qcu';o.sig=x[4];o.o=opts;o.a=opts.indexOf(x[2]);o.e=s.n+' — '+s.d;o.ref='Signalétique';o.sk=x[2];o.q=x[4]==='img'?'Que signifie ce geste ?':'Quel est le geste : « '+s.n+' » ?';}
  else if(o.t==='tf'){o.a=x[3];o.e=x[4];o.ref=x[5];}
  else if(o.t==='qcu'||o.t==='qcm'){o.o=x[3];o.a=x[4];o.e=x[5];o.ref=x[6];}
  else {o.k=x[3];o.m=x[4];o.ref=x[5];o.need=x[6]||x[3].length;
    if(o.t==='open'&&/^(Hors dispositions FFR, citez|Citez|Énumérez|Complétez|Quels |Quelles |Quand |Décrivez (deux|trois|quatre|cinq) )/.test(o.q)){const NB={deux:2,trois:3,quatre:4,cinq:5,six:6};const m=o.q.match(/\b(deux|trois|quatre|cinq|six)\b/g);o.boxes=m?m.map(w=>NB[w]).reduce((x,y)=>x+y,0):o.k.length;o.need=Math.min(o.boxes,o.k.length);}}
  o.sc=scopeOf(o.q);QS.push(o);
});}
const QBYID={};QS.forEach(q=>QBYID[q.id]=q);

// ---------- Stockage ----------
const KEY='rugby_prep_v4';
function defStore(){return{v:4,level:null,theme:'auto',tol:'normal',srs:{},hist:[],days:[]};}
let ST=defStore();
function loadStore(){try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.v===4)ST=Object.assign(defStore(),s);}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(ST));}catch(e){}}
loadStore();
const LV=()=>ST.level==null?1:ST.level;
const INTV=[0,4,24,72,168,336];
const W=[0,.4,.6,.75,.9,1];
function rec(id){return ST.srs[id];}
// Boîtes : 0 = ratée/à revoir, 1 = réussie une fois, 2 = réussie deux fois,
// 3-5 = réussie à nouveau après un délai (mémorisation durable).
function srsUp(id,frac){
  const r=ST.srs[id]||{b:0,n:0,ok:0};
  const wasDue=!r.due||r.due<=now();
  r.n++;
  if(frac>=0.7){r.ok++;if(r.b<2||wasDue)r.b=Math.min(5,r.b+1);}
  else if(frac<0.4)r.b=0;
  r.due=now()+INTV[r.b]*H;r.last=frac;
  ST.srs[id]=r;markDay();save();
}
function markDay(){const d=new Date().toISOString().slice(0,10);if(!ST.days.includes(d)){ST.days.push(d);if(ST.days.length>400)ST.days.shift();}}
function streak(){let s=0;const d=new Date();for(;;){const k=d.toISOString().slice(0,10);if(ST.days.includes(k)){s++;d.setDate(d.getDate()-1);}else{if(s===0){d.setDate(d.getDate()-1);const k2=d.toISOString().slice(0,10);if(ST.days.includes(k2)){continue;}}break;}}return s;}

// ---------- Filtres par niveau ----------
function inScope(q,lv){return !q.sc||(q.sc==='lo'?lv<=2:lv>=2);}
function qsFor(topic,lv){lv=lv==null?LV():lv;return QS.filter(q=>(!topic||q.r===topic)&&q.l<=lv&&inScope(q,lv));}
function defItems(){return DEFS.map((d,i)=>({id:'D-'+i,term:d[0],def:d[1],ref:d[2]}));}
const DITEMS=defItems();
function mastery(ids){if(!ids.length)return 0;let s=0;ids.forEach(id=>{const r=rec(id);if(r)s+=W[r.b]||0;});return s/ids.length;}
function topicStats(k){const ids=qsFor(k).map(q=>q.id);let seen=0,ok=0,anch=0,due=0;const t=now();ids.forEach(id=>{const r=rec(id);if(!r)return;seen++;if(r.b>=1)ok++;if(r.b>=3)anch++;if(r.due<=t)due++;});return{n:ids.length,seen,ok,anch,due};}
function topicMastery(k){return mastery(qsFor(k).map(q=>q.id));}
function defMastery(){return mastery(DITEMS.map(d=>d.id));}
function dueList(){
  const lv=LV(),t=now();
  const pool=[...qsFor(null,lv).map(q=>q.id),...DITEMS.map(d=>d.id)];
  return pool.filter(id=>{const r=rec(id);return r&&r.due<=t;});
}
function newList(){const pool=[...qsFor(null,LV()).map(q=>q.id),...DITEMS.map(d=>d.id)];return pool.filter(id=>!rec(id));}
function globalMastery(){return mastery([...qsFor(null,LV()).map(q=>q.id),...DITEMS.map(d=>d.id)]);}

// ---------- Texte : normalisation & comparaison ----------
function norm(s){return String(s).toLowerCase().replace(/[’‘`]/g,"'").normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/œ/g,'oe').replace(/[^a-z0-9' ,.-]/g,' ').replace(/[,.]/g,' ').replace(/\s+/g,' ').trim();}
function tok(s){return norm(s).replace(/['-]/g,' ').split(' ').filter(w=>w);}
function tokD(s){const out=[];String(s).split(/\s+/).forEach(w=>{const parts=w.split(/(?<=['’-])/);parts.forEach(p=>{const n=tok(p);if(n.length)out.push({d:p,n:n.join('')});});});return out;}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array(n+1).fill(0).map((_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c;}return p[n];}
function near(a,b){if(a===b)return 2;const d=lev(a,b),L=Math.max(a.length,b.length);const tl=ST.tol==='strict'?0:ST.tol==='souple'?1:0;if(d<=1&&L>2)return 1;if(L>4&&d<=2+tl)return 1;return 0;}
function compareText(user,expected){
  const ED=tokD(expected),u=tok(user),e=ED.map(x=>x.n);const n=e.length,m=u.length;
  if(!m)return{score:0,diff:ED.map(x=>({w:x.d,s:'miss'}))};
  const D=Array(n+1).fill(0).map(()=>new Float32Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--){const s=near(e[i],u[j]);D[i][j]=Math.max(D[i+1][j],D[i][j+1],s?D[i+1][j+1]+(s===2?1:.75):0);}
  const diff=[];let i=0,j=0,got=0;
  while(i<n){if(j<m){const s=near(e[i],u[j]);if(s&&D[i][j]===D[i+1][j+1]+(s===2?1:.75)){diff.push({w:ED[i].d,s:s===2?'ok':'close',u:u[j]});got+=s===2?1:.75;i++;j++;continue;}if(D[i][j+1]>=D[i+1][j]){j++;continue;}}diff.push({w:ED[i].d,s:'miss'});i++;}
  const extra=Math.max(0,m-n*1.25);
  return{score:Math.max(0,Math.min(1,got/n-extra/(n*4))),diff};
}
function txt(a){return Array.isArray(a)?a.filter(x=>x).join(' ; '):(a||'');}
function kwHit(text,kws){const t=norm(text);return kws.split('|').some(k=>{const nk=norm(k);return nk?t.includes(nk):text.includes(k);});}
function autoTicks(text,k){text=txt(text);return k.map(x=>kwHit(text,x[1]));}
function diffHTML(diff){return '<div class="diff">'+diff.map(d=>`<span class="${d.s}">${esc(d.w)}</span>`).join(' ')+'</div>';}

const LOGO='<img class="hdr-logo" src="'+LOGO_PNG+'" alt="Avantage">';

// ---------- Thème ----------
function applyTheme(){const t=ST.theme==='auto'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):ST.theme;document.documentElement.setAttribute('data-theme',t);}
applyTheme();try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);}catch(e){}

// ---------- Routage ----------
let VIEW='home',PARAM=null,SES=null,TIMER=null;
const SCR={};function vkey(){return VIEW+'|'+(PARAM==null?'':PARAM);}
function go(v,p,restore){
  if(SES&&SES.kind==='exam'&&v!=='exam'){if(!SES.done){if(!confirmLeave())return false;clearInterval(TIMER);}SES=null;}
  else if(SES&&SES.kind!=='exam'&&v!=='session')SES=null;
  SCR[vkey()]=scrollY;VIEW=v;PARAM=p;render();scrollTo(0,restore?(SCR[vkey()]||0):0);}
function confirmLeave(){if(SES._leave)return true;SES._leave=true;toast("Examen en cours : appuie à nouveau pour quitter (la copie sera perdue).");setTimeout(()=>{if(SES)SES._leave=false;},3500);return false;}
function toast(m){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 14px;border-radius:10px;font-size:13px;z-index:50;max-width:90%;box-shadow:0 4px 14px rgba(0,0,0,.25)';document.body.appendChild(t);}t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',3200);}

function header(){
  const L=LEVELS[LV()];
  return `<div class="hdr"><div class="hdr-row">${LOGO}<div><div class="hdr-t">Avantage</div><div class="hdr-s">Règles du rugby · Version ${APPV}</div></div><button class="hdr-btn" onclick="go('settings')" aria-label="Paramètres">${IC.gear}</button></div></div><div class="tricolor"></div>`;
}
function nav(){
  const items=[['home','Accueil',IC.home],['rules','Règles',IC.book],['defs','Définitions',IC.abc],['exam','Examen',IC.exam],['review','Réviser',IC.loop]];
  const cur={session:'rules',topic:'rules',settings:'home',fiche:'rules',deflist:'defs'}[VIEW]||VIEW;
  const L=LEVELS[LV()];
  return `<nav class="nav"><div class="side-brand">${LOGO}<div><div class="hdr-t">Avantage</div><div class="hdr-s">Règles du rugby<br>Version ${APPV}</div></div></div><div class="tricolor side-only"></div>
  <div class="nav-in">${items.map(([v,l,i])=>`<button class="${cur===v?'on':''}" onclick="go('${v}')">${i}<span>${l}</span></button>`).join('')}
  <button class="side-only ${VIEW==='settings'?'on':''}" onclick="go('settings')">${IC.gear}<span>Paramètres</span></button></div>
  <div class="side-foot side-only"><button class="side-lv" onclick="go('settings')"><span class="lvbadge" style="background:${L.color};width:38px;height:38px;font-size:12px">${L.code}</span><span><b>${L.name}</b><br><small>Changer de formation</small></span></button><div class="tiny" style="opacity:.6;margin-top:10px">Règles World Rugby 2026</div></div></nav>`;
}
function render(){
  if(ST.level==null&&VIEW!=='settings'){$('#app').innerHTML=header()+`<div class="wrap">${levelPicker(true)}</div>`;return;}
  const V={home:vHome,rules:vRules,topic:vTopic,defs:vDefs,deflist:vDefList,exam:vExam,review:vReview,settings:vSettings,session:vSession};
  const narrow=['session','settings'].includes(VIEW)||(VIEW==='exam'&&SES&&SES.phase!=='run');
  const focus=VIEW==='session'||(VIEW==='exam'&&SES&&(SES.phase==='run'||SES.phase==='corr'));
  $('#app').className='app'+(focus?' focus':'');
  $('#app').innerHTML=header()+`<div class="wrap v-${VIEW} ${narrow?'narrow':''}" id="main">${(V[VIEW]||vHome)()}</div>`+nav();
  if(SWIN){const m=$('#main');if(m)m.classList.add(SWIN>0?'swin-l':'swin-r');SWIN=0;}
  if(VIEW==='session'||(VIEW==='exam'&&SES))afterSession();
  syncGuard();
}

// ---------- Choix du niveau ----------
function levelPicker(first){
  return `${first?`<div class="h1">Bienvenue&nbsp;!</div><p class="muted" style="margin-bottom:14px">Choisis ta formation. Le contenu (questions, définitions exigées, format d'examen) s'adapte à ton niveau. Tu pourras changer à tout moment.</p>`:''}
  ${LEVELS.map(l=>`<button class="lvcard ${ST.level===l.id?'on':''}" onclick="setLevel(${l.id})"><div class="lvbadge" style="background:${l.color}">${l.code}</div><div class="grow"><b>${l.name}</b> <span class="small muted">${l.full}</span><div class="small muted">${l.sub}</div><div class="tiny muted">${qsFor(null,l.id).length} questions · ${DEFS.length} définitions</div></div></button>`).join('')}`;
}
function setLevel(l){ST.level=l;save();if(VIEW==='settings')render();else go('home');}

// ---------- Accueil ----------

  </div>
  </div><div class="col">

  <div class="card"><div class="mgrid">${laws.map(cell).join('')}</div>
  <div class="mrow">${oth.map(t=>{const m=Math.round(topicMastery(t.k)*100);return `<button onclick="go('topic','${t.k}')">${esc(t.t.split(' (')[0])} · ${m}%</button>`;}).join('')}<button onclick="go('defs')">Définitions · ${Math.round(defMastery()*100)}%</button></div>

// ---------- Règles ----------
function vRules(){
  const row=t=>{const n=qsFor(t.k).length,m=Math.round(topicMastery(t.k)*100);return `<button class="it" onclick="go('topic','${t.k}')"><div class="num">${t.n}</div><div class="grow"><b class="small">${t.g==='law'?'Règle '+t.n+' — ':''}${esc(t.t)}</b><div class="row" style="margin-top:5px"><div class="bar grow"><u style="width:${m}%"></u></div><span class="tiny muted">${n} q · ${m}%</span></div></div></button>`;};
  const oth=TOPICS.filter(t=>t.g==='other'&&(!t.min||LV()>=t.min));
  return `<div class="h1">Quiz par règle</div><p class="muted small">Règles du Jeu World Rugby 2026 et dispositions FFR. Questions filtrées pour le niveau ${LEVELS[LV()].code} (et inférieurs).</p>
  <div class="row" style="margin:12px 0"><button class="btn block" onclick="startMixed()">Quiz mélangé (${ST.qn&&ST.qn!=='all'?ST.qn:ST.qn==='all'?40:20} questions, toutes règles)</button></div>
  <div class="h2">Règles du jeu</div><div class="list cols">${TOPICS.filter(t=>t.g==='law').map(row).join('')}</div>
  <div class="h2">Compléments</div><div class="list cols">${oth.map(row).join('')}</div>`;
}
function vTopic(){
  const t=TOPIC[PARAM];if(!t)return vRules();
  const qs=qsFor(t.k),cz=CLOZE.filter(c=>c.r===t.k),m=Math.round(topicMastery(t.k)*100);
  const byT={};qs.forEach(q=>byT[q.t]=(byT[q.t]||0)+1);
  const lbl={tf:'Vrai/Faux',qcu:'QCU',qcm:'QCM',open:'Questions ouvertes',case:'Situations de jeu'};
  return `<button class="btn ghost" style="padding:8px 12px;margin-bottom:10px" onclick="go('rules')">${IC.back} Règles</button>
  <div class="home-grid"><div class="col">
  <div class="row"><div class="num" style="width:46px;height:46px;font-size:17px">${t.n}</div><div><div class="h1" style="margin:0">${t.g==='law'?'Règle '+t.n:''}</div><b>${esc(t.t)}</b></div></div>
  <div class="row" style="margin:12px 0 4px"><div class="bar grow"><u style="width:${m}%"></u></div><span class="small muted">${m}% maîtrisé</span></div>
  ${(()=>{const s=topicStats(t.k);return `<div class="tstats"><div><b>${s.seen}/${s.n}</b><span>vues</span></div><div><b>${s.ok}/${s.n}</b><span>réussies</span></div><div><b>${s.anch}/${s.n}</b><span>ancrées</span></div><div><b>${s.due}</b><span>à revoir</span></div></div>`;})()}
  <details class="card small" style="padding:10px 14px"><summary style="cursor:pointer;font-weight:700">Comment progresse la maîtrise ?</summary><div class="muted" style="margin-top:8px">Chaque question réussie compte <b>40 %</b>, puis <b>60 %</b> si tu la réussis une deuxième fois. Pour aller jusqu'à 100 %, il faut la réussir à nouveau <b>après un délai</b> (4 h, puis 1 j, 3 j, 7 j) : c'est ce qui montre que la règle est vraiment mémorisée, pas seulement retenue sur le moment. Ces questions reviennent toutes seules dans « Réviser ». Une erreur remet la question à zéro.</div></details>
  <div class="row wrapf" style="gap:6px;margin-bottom:12px">${Object.keys(byT).map(k=>`<span class="tag">${lbl[k]} : ${byT[k]}</span>`).join('')}</div>
  ${qs.length?`<div class="card" style="padding:12px 14px"><div class="small" style="margin-bottom:6px">Nombre de questions</div><div class="seg" style="margin-bottom:10px">${QN_OPTS.filter(v=>v==='all'||v<qs.length).map(v=>`<button class="${qnSel(qs.length)===v?'on':''}" onclick="setQN(${v==='all'?"'all'":v})">${v==='all'?'Toutes ('+qs.length+')':v}</button>`).join('')}</div><button class="btn block" onclick="startTopic('${t.k}',${qnSel(qs.length)==='all'?999:qnSel(qs.length)})">Lancer le quiz (${qnSel(qs.length)==='all'?qs.length:qnSel(qs.length)} questions)</button></div>`:''}
  ${cz.length?`<button class="btn ghost block" style="margin-bottom:8px" onclick="startCloze('${t.k}')">${IC.pen} Texte à compléter (${cz.length})</button>`:''}
  ${qs.length?'':`<div class="empty">Aucune question à ce niveau pour ce thème.</div>`}
  </div><div class="col">${t.k==='SIG'?`<div class="h2 first">Galerie des signaux</div><div class="gal">${SIGNALS.map(s=>`<div class="gal-it">${sigSVG(s.k)}<b>${esc(s.n)}</b><span>${esc(s.d)}</span></div>`).join('')}</div><div class="tiny muted">Pictogrammes dessinés pour l'appli d'après les descriptions de la signalétique World Rugby 2026. La figure fait face au lecteur ; le côté droit de l'image indique l'équipe concernée.</div>`:`<div class="h2 first">Fiche de synthèse</div><div class="card fiche"><ul>${(FICHES[t.k]||[]).map(b=>`<li>${esc(b)}</li>`).join('')}</ul></div>`}</div></div>`;
}

// ---------- Définitions ----------
function vDefs(){
  const m=Math.round(defMastery()*100),seen=DITEMS.filter(d=>rec(d.id)).length;
  return `<div class="h1">Définitions</div><p class="muted small">Les ${DEFS.length} définitions des Règles du Jeu 2026. ${LV()>=2?"À l'AN2 et l'AN3, elles sont exigées mot pour mot (synonymes acceptés).":"À l'AN1, elles sont évaluées sous forme de textes à compléter."}</p>
  <div class="card"><div class="row"><div class="bar grow"><u style="width:${m}%"></u></div><span class="small muted">${seen}/${DEFS.length} vues · ${m}%</span></div></div>
  ${(()=>{const o=dOpt();const sel=defSelection();return `<div class="card"><div class="sec-h" style="margin-bottom:8px">Réglages de la série</div>
   <div class="small" style="margin-bottom:6px">Nombre de cartes</div>
   <div class="seg" style="margin-bottom:12px">${[10,20,30,50,'all'].map(v=>`<button class="${o.n===v?'on':''}" onclick="setDOpt('n',${v==='all'?"'all'":v})">${v==='all'?'Toutes ('+DITEMS.length+')':v}</button>`).join('')}</div>
   <div class="small" style="margin-bottom:6px">Ordre</div>
   <div class="seg" style="margin-bottom:8px">${[['need','Priorité révision'],['alpha','Alphabétique'],['rand','Aléatoire']].map(([v,l])=>`<button class="${o.ord===v?'on':''}" onclick="setDOpt('ord','${v}')">${l}</button>`).join('')}</div>
   ${o.ord==='alpha'?`<div class="row" style="margin-top:10px"><span class="small">Commencer à la lettre</span><select style="width:auto" onchange="setDOpt('from',this.value)">${DLETTERS.map(c=>`<option ${o.from===c?'selected':''}>${c}</option>`).join('')}</select></div>`:''}
   <div class="tiny muted" style="margin-top:8px">${o.ord==='need'?"Priorité révision : d'abord les cartes jamais vues, puis ratées, puis à revoir. En enchaînant les séries, tu passes sur les "+DITEMS.length+" définitions.":o.ord==='alpha'?'Série : « '+esc(sel[0].term)+' » → « '+esc(sel[sel.length-1].term)+' » ('+sel.length+' cartes).':'Tirage au hasard parmi les '+DITEMS.length+' définitions.'}</div></div>`;})()}
  <div class="list">
   <button class="it" onclick="startDefs('dict')"><div class="num">${IC.pen}</div><div class="grow"><b>Dictée</b><div class="small muted">Récite la définition, correction mot à mot</div></div></button>
   <button class="it" onclick="startDefs('cards')"><div class="num">${IC.card}</div><div class="grow"><b>Flashcards</b><div class="small muted">Retourne la carte et note-toi</div></div></button>
   <button class="it" onclick="startDefs('match')"><div class="num">?</div><div class="grow"><b>Quel est ce terme ?</b><div class="small muted">Retrouve le terme à partir de la définition</div></div></button>
   <button class="it" onclick="startDefs('holes')"><div class="num">…</div><div class="grow"><b>Définitions à trous</b><div class="small muted">Complète les mots-clés manquants</div></div></button>
   <button class="it" onclick="go('deflist')"><div class="num">${IC.book}</div><div class="grow"><b>Lexique complet</b><div class="small muted">Lire et rechercher, entraîner un terme précis</div></div></button>
  </div>`;
}
let DQ='';
function vDefList(){
  const f=norm(DQ);const items=DITEMS.filter(d=>!f||norm(d.term+' '+d.def).includes(f));
  return `<button class="btn ghost" style="padding:8px 12px;margin-bottom:10px" onclick="go('defs')">${IC.back} Définitions</button>
  <div class="search"><input id="dq" placeholder="Rechercher un terme…" value="${esc(DQ)}" oninput="DQ=this.value;const p=this.selectionStart;render();const e=$('#dq');e.focus();e.setSelectionRange(p,p)"></div>
  <div class="small muted" style="margin-bottom:8px">${items.length} résultat(s)</div>
  <div class="dgrid">${items.map(d=>{const r=rec(d.id);return `<div class="card"><div class="row"><b class="grow">${esc(d.term)}</b>${d.ref?`<span class="ref">R. ${esc(d.ref)}</span>`:''}${r?`<span class="tag">boîte ${r.b}</span>`:''}</div><div class="small" style="margin:6px 0 8px">${esc(d.def)}</div><button class="btn sec" style="padding:7px 12px;font-size:13px" onclick="startDefs('dict',['${d.id}'])">S'entraîner</button></div>`;}).join('')}</div>`;
}

// ---------- Sessions d'apprentissage ----------
function mkQ(q){return{type:'q',q,id:q.id};}
function mkD(d,mode){return{type:'def',d,mode,id:d.id};}
function newSession(title,items,kind){const from=(VIEW==='session'&&SES&&SES.from)?SES.from:{v:VIEW,p:PARAM};SES={kind:kind||'learn',title,items,i:0,res:[],st:null,from};VIEW='session';render();scrollTo(0,0);}
function fromLabel(f){if(!f)return 'Accueil';if(f.v==='topic'){const t=TOPIC[f.p];return t?(t.g==='law'?'Règle '+t.n:t.t.split(' (')[0]):'Règles';}return {home:'Accueil',rules:'Règles',defs:'Définitions',deflist:'Lexique',review:'Réviser',exam:'Examen',settings:'Paramètres'}[f.v]||'Accueil';}
function backFrom(){const f=SES&&SES.from;SES=null;f?go(f.v,f.p):go('home');}
function orderByNeed(list){const t=now();return list.map(x=>{const r=rec(x.id);return{x,k:!r?0:r.b===0?.5:r.due<=t?1:2+r.b+Math.random()}}).sort((a,b)=>a.k-b.k||Math.random()-.5).map(o=>o.x);}

// ---------- Rendu d'un élément ----------
function itemHTML(it,ans,show){
  if(it.type==='q')return qHTML(it.q,ans,show);
  if(it.type==='def')return defHTML(it,ans,show);
  if(it.type==='cloze')return clozeHTML(it.c,ans,show);
  if(it.type==='rap')return rapHTML(it.r,ans,show);
  return '';
}
function optLabel(q,i){return q.sig?SIGBY[q.o[i]].n:q.o[i];}
function topicTag(r,ref){const t=TOPIC[r];return `<div class="row" style="gap:6px"><span class="tag">${t?(t.g==='law'?'Règle '+t.n:esc(t.t.split(' (')[0])):''}</span>${ref?`<span class="ref">${esc(ref)}</span>`:''}</div>`;}
function qHTML(q,ans,show){

  if(q.t==='tf'){
    h+=`<div class="qtxt">${esc(q.q)}</div><div class="tfrow">${[true,false].map(v=>{let c='opt radio';if(ans===v)c+=' sel';if(show){if(v===q.a)c+=ans===v?' good':' miss';else if(ans===v)c+=' bad';}return `<button class="${c}" onclick="setAns(${v})">${v?'VRAI':'FAUX'}<kbd class="kb">${v?'V':'F'}</kbd></button>`;}).join('')}</div>`;
  }else if(q.t==='qcu'||q.t==='qcm'){
    const multi=q.t==="qcm";const a=ans==null?(multi?[]:null):ans;
    h+=`<div class="qtxt">${esc(q.q)}</div>${multi?'<div class="tiny muted" style="margin:-8px 0 10px">Plusieurs réponses possibles (toutes ou aucune peuvent être vraies).</div>':''}`;

    if(q.sig==='img')h+='<div class="sig2">';
    h+=(q._ord||(q._ord=shuffle(q.o.map((_,i)=>i)))).map((i,pos)=>{const on=multi?a.includes(i):a===i;const ok=multi?q.a.includes(i):q.a===i;let c='opt'+(multi?'':' radio');if(on)c+=' sel';if(show){if(ok)c+=on?' good':' miss';else if(on)c+=' bad';}return `<button class="${c}" onclick="setAns(${i})"><span class="bx">${on?'✓':''}</span><span class="grow">${esc(optLabel(q,i))}</span><kbd class="kb">${pos+1}</kbd></button>`;}).join('');
    if(q.sig==='img')h+='</div>';
  }else{
    h+=`<div class="qtxt">${q.t==='case'?'<span class="sec-h">Situation — donnez et motivez votre décision</span><br>':''}${esc(q.q)}</div>`;
    if(q.boxes){const a=Array.isArray(ans)?ans:[];h+=`<div class="nbexp">${q.boxes} réponse${q.boxes>1?'s':''} attendue${q.boxes>1?'s':''}${q.k.length>q.boxes?` <span class="muted">(parmi ${q.k.length} possibles)</span>`:''}</div><div class="lboxes">${Array.from({length:q.boxes},(_,i)=>`<div class="lbox"><span class="lnum">${i+1}</span><input data-li="${i}" ${show?'disabled':''} value="${esc(a[i]||'')}" placeholder="Réponse ${i+1}" oninput="listIn(${i},this.value)" onkeydown="listKey(event,${i})"></div>`).join('')}</div>`;}
    else h+=`<textarea id="ta" placeholder="${q.t==='case'?'Décision (sanction, équipe, point de reprise) + motivation…':'Ta réponse…'}" ${show?'disabled':''} oninput="SES.cur=this.value">${esc(ans||'')}</textarea>`;
  }
  if(show)h+=fbHTML(q,ans);
  return h;
}
function fracOf(it,ans,ticks){
  if(it.type==='q'){const q=it.q;
    if(q.t==='tf')return ans===q.a?1:0;
    if(q.t==='qcu')return ans===q.a?1:0;
    if(q.t==='qcm'){const a=ans||[];let e=0;q.o.forEach((_,i)=>{if(a.includes(i)!==q.a.includes(i))e++;});return e===0?1:e===1?.5:0;}
    const t=ticks||autoTicks(ans||'',q.k);return Math.min(1,t.filter(Boolean).length/q.need);
  }
  if(it.type==='def'){if(it.mode==='match')return ans===it.d.id?1:0;if(it.mode==='cards')return ans==null?0:ans;if(it.mode==='holes'){const H=holesOf(it.d);return H.idx.filter((w,k)=>near(norm((ans||[])[k]||''),norm(H.w[w]))).length/H.idx.length;}return compareText(ans||'',it.d.def).score;}
  if(it.type==='cloze'){const bl=clozeBlanks(it.c);return bl.filter((b,i)=>(ans||[])[i]===b).length/bl.length;}
  if(it.type==='rap'){const t=ticks||autoTicks(ans||'',it.r.k);return t.filter(Boolean).length/t.length;}
  return 0;
}
function fbHTML(q,ans){
  if(q.t==='tf'||q.t==='qcu'||q.t==='qcm'){
    const f=fracOf({type:'q',q},ans);const c=f===1?'ok':f>0?'mid':'ko';
    const sol=q.t==='tf'?(q.a?'VRAI':'FAUX'):q.t==='qcu'?optLabel(q,q.a):(q.a.length?q.a.map(i=>q.o[i]).join(' · '):'Aucune proposition');
    return `<div class="fb ${c}"><b class="t">${f===1?'Bonne réponse':f>0?'Presque — une erreur':'Mauvaise réponse'}</b>${f<1?`<div style="margin-bottom:4px"><b>Réponse :</b> ${esc(sol)}</div>`:''}${esc(q.e||'')}</div>`;
  }
  const ticks=SES&&SES.ticks?SES.ticks:autoTicks(ans||'',q.k);
  const n=ticks.filter(Boolean).length;
  return `<div class="fb ${n>=q.need?'ok':n>=q.need/2?'mid':'ko'}"><b class="t">Éléments attendus — ${n}/${q.need}${q.need<q.k.length?' requis sur '+q.k.length+' possibles':''}</b><div class="tiny muted" style="margin-bottom:6px">Coché automatiquement d'après tes mots-clés. Ajuste si besoin (synonymes acceptés).</div>${q.k.map((x,i)=>`<button class="chk ${ticks[i]?'on':''}" onclick="tick(${i})"><span class="bx">${ticks[i]?'✓':''}</span><span>${esc(x[0])}</span></button>`).join('')}<div class="model"><b class="small">Réponse type</b><br>${esc(q.m)}</div></div>`;
}
// définitions

  }else if(it.mode==='cards'){

    if(show)h+=`<div class="tfrow" style="grid-template-columns:1fr 1fr 1fr"><button class="opt radio ${ans===0?'bad':''}" onclick="rateCard(0)">À revoir</button><button class="opt radio ${ans===.5?'sel':''}" onclick="rateCard(.5)">Partiel</button><button class="opt radio ${ans===1?'good':''}" onclick="rateCard(1)">Su !</button></div>`;
  }else if(it.mode==='match'){
    if(!it.opts)it.opts=shuffle([d,...pick(DITEMS.filter(x=>x.id!==d.id),3)]);
    h+=`<div class="qtxt" style="font-weight:500">« ${esc(d.def.replace(new RegExp(d.term.split(' (')[0].replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),'…'))} »</div>`;
    h+=it.opts.map(o=>{let c='opt radio';if(ans===o.id)c+=' sel';if(show){if(o.id===d.id)c+=ans===o.id?' good':' miss';else if(ans===o.id)c+=' bad';}return `<button class="${c}" onclick="setAns('${o.id}')"><span class="bx"></span><span class="grow">${esc(o.term)}</span><kbd class="kb">${it.opts.indexOf(o)+1}</kbd></button>`;}).join('');
    if(show)h+=`<div class="fb ${ans===d.id?'ok':'ko'}"><b class="t">${esc(d.term)}</b>${esc(d.def)}</div>`;
  }else{
    const Hh=holesOf(d);const a=ans||[];let k=0;
    h+=`<div class="qtxt">${esc(d.term)}</div><div class="clz">${Hh.w.map((w,wi)=>{if(Hh.idx.includes(wi)){const ki=k++;const ok=show&&near(norm(a[ki]||''),norm(w));return show?`<b style="color:${ok?'var(--ok)':'var(--err)'}">${esc(w)}</b>${!ok&&a[ki]?` <s class="tiny muted">${esc(a[ki])}</s>`:''}`:`<input data-k="${ki}" style="width:${Math.max(4,w.length)+2}ch;display:inline-block;padding:3px 6px" value="${esc(a[ki]||'')}" oninput="holeIn(${ki},this.value)">`;}return esc(w);}).join(' ')}</div>`;
    if(show){const f=fracOf(it,ans);h+=`<div class="fb ${f>=.85?'ok':f>=.5?'mid':'ko'}"><b class="t">${Math.round(f*100)}% des mots-clés</b></div>`;}
  }
  return h;
}
const STOP=new Set('le la les un une des de du d l et ou a au aux en dans sur par pour que qui ne pas se sa son ses ce cette ces il elle est sont qu avec sans être etre ou leur leurs lui y plus a'.split(' '));
function holesOf(d){if(d._h)return d._h;const w=d.def.split(/\s+/);const cand=w.map((x,i)=>({i,s:norm(x).replace(/[^a-z0-9]/g,'')})).filter(o=>o.s.length>3&&!STOP.has(o.s));const n=Math.max(1,Math.min(6,Math.round(cand.length/4)));const idx=pick(cand,n).map(o=>o.i).sort((a,b)=>a-b);d._h={w,idx};return d._h;}
function listIn(i,v){if(!Array.isArray(SES.cur))SES.cur=[];SES.cur[i]=v;if(SES.kind==='exam')SES.ans[SES.i]=SES.cur;}
function listKey(e,i){if(e.key==='Enter'&&!e.ctrlKey&&!e.metaKey){e.preventDefault();e.stopPropagation();const n=document.querySelector(`[data-li="${i+1}"]`);if(n)n.focus();else if(VIEW==='session'&&SES.st!=='show')checkItem();}}
function holeIn(k,v){SES.cur=SES.cur||[];SES.cur[k]=v;}
// textes à trous
function clozeBlanks(c){if(!c._b)c._b=[...c.x.matchAll(/\{([^}]+)\}/g)].map(m=>m[1]);return c._b;}
function clozeHTML(c,ans,show){
  const bl=clozeBlanks(c);if(!c._opts)c._opts=shuffle([...new Set([...bl,...c.b])]);const a=ans||[];let i=0;
  let h=`${topicTag(c.r,'')}<div class="qtxt">${esc(c.t)}</div><div class="tiny muted" style="margin:-8px 0 8px">Complète avec les propositions (une même proposition peut servir plusieurs fois).</div><div class="clz card">`;
  h+=esc(c.x).replace(/\{([^}]+)\}/g,()=>{const k=i++;const v=a[k]||'';const cl=show?(v===bl[k]?'good':'bad'):'';return `<select class="${cl}" ${show?'disabled':''} onchange="clozeIn(${k},this.value)"><option value="">……</option>${c._opts.map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select>${show&&v!==bl[k]?` <b class="small" style="color:var(--ok)">${esc(bl[k])}</b>`:''}`;});
  h+='</div>';
  if(show){const f=fracOf({type:'cloze',c},ans);h+=`<div class="fb ${f===1?'ok':f>=.5?'mid':'ko'}"><b class="t">${Math.round(f*bl.length)}/${bl.length} termes corrects</b></div>`;}
  return h;
}
function clozeIn(k,v){SES.cur=SES.cur||[];SES.cur[k]=v;}
// rapports

  return h;

// ---------- Moteur de session (apprentissage) ----------
function vSession(){
  const S=SES;if(!S)return vHome();
  if(S.i>=S.items.length)return sessionEnd();
  const it=S.items[S.i];const show=S.st==='show';
  const needsBtn=!(it.type==='def'&&it.mode==='cards');
  return `<div class="qhead"><button class="btn ghost" style="padding:7px 9px" onclick="quitSes()">${IC.x}</button><div class="prog"><u style="width:${S.i/S.items.length*100}%"></u></div><span class="small muted">${S.i+1}/${S.items.length}</span></div>
  <div class="tiny muted" style="margin-bottom:6px">${esc(S.title)}</div>
  <div class="card">${itemHTML(it,S.cur,show)}</div>
  ${needsBtn||show?`<div class="sticky">${show?`<button class="btn block" onclick="nextItem()">${S.i+1<S.items.length?'Suivant':'Terminer'}</button>`:`<button class="btn block" onclick="checkItem()">Vérifier</button>`}</div>`:''}`;
}
function afterSession(){const t=$('#ta')||document.querySelector('[data-li="0"]');if(t&&!t.disabled&&SES&&SES.kind!=='exam'&&matchMedia('(pointer:fine)').matches)t.focus({preventScroll:true});}
function setAns(v){const S=SES;if(!S||S.st==='show')return;const it=S.items[S.i];
  if(it.type==='q'&&it.q.t==='qcm'){S.cur=S.cur||[];S.cur=S.cur.includes(v)?S.cur.filter(x=>x!==v):[...S.cur,v];}
  else S.cur=v;
  if(S.kind==='exam'){S.ans[S.i]=S.cur;}
  render();}
function checkItem(){const S=SES;const it=S.items[S.i];
  if(it.type==='q'&&(it.q.t==='open'||it.q.t==='case'))S.ticks=autoTicks(S.cur||'',it.q.k);
  if(it.type==='rap')S.ticks=autoTicks(S.cur||'',it.r.k);
  S.st='show';render();
  requestAnimationFrame(()=>{const fb=document.querySelector('#main .fb');if(!fb)return;const r=fb.getBoundingClientRect(),st=document.querySelector('.sticky');const lim=innerHeight-(st?st.offsetHeight+16:90);if(r.bottom>lim){const dy=Math.min(r.top-70,r.bottom-lim);if(dy>0)scrollBy({top:dy,behavior:'smooth'});}});}
function tick(i){SES.ticks[i]=!SES.ticks[i];render();}
function revealCard(){SES.st='show';render();}
function rateCard(v){SES.cur=v;nextItem();}
function nextItem(){const S=SES;const it=S.items[S.i];
  const f=fracOf(it,S.cur,S.ticks);S.res.push({it,f,ans:S.cur});
  if(it.type!=='cloze'&&it.type!=='rap')srsUp(it.id,f);else markDay();
  S.i++;S.cur=undefined;S.ticks=null;S.st=null;render();scrollTo(0,0);}
function quitSes(){if(SES&&SES.res.length)ST.hist.push({kind:'learn',d:now(),n:SES.res.length,f:avg(SES.res.map(r=>r.f))});save();backFrom();}
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
function sessionEnd(){
  const S=SES;const f=avg(S.res.map(r=>r.f));const p=Math.round(f*100);
  if(!S._saved){ST.hist.push({kind:'learn',d:now(),n:S.res.length,f});if(ST.hist.length>200)ST.hist.shift();save();S._saved=true;}
  const miss=S.res.filter(r=>r.f<.7);

  <div class="tiny muted" style="text-align:center;margin:18px 0 6px">Créée par <b>Enzo Ginhoux</b>, arbitre FFR niveau 3 (Ligue Sud)</div>`;
}
function exportData(){const t=JSON.stringify(ST);const box=$('#exp');box.style.display='block';box.value=t;box.select();try{navigator.clipboard.writeText(t).then(()=>toast('Progression copiée dans le presse-papiers'));}catch(e){toast('Copie le texte affiché');}}
function importText(){const v=prompt('Colle ici le texte de ta progression exportée :');if(!v)return;try{const s=JSON.parse(v);if(s.v!==4)throw 0;ST=Object.assign(defStore(),s);save();applyTheme();toast('Progression importée');render();}catch(e){toast('Texte invalide');}}
function importData(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const s=JSON.parse(r.result);if(s.v!==4)throw 0;ST=Object.assign(defStore(),s);save();applyTheme();toast('Progression importée');render();}catch(e){toast('Fichier invalide');}};r.readAsText(f);}
let RS=0;function resetData(){if(!RS){RS=1;toast('Appuie encore pour tout effacer');setTimeout(()=>RS=0,3000);return;}const l=ST.level,t=ST.theme;ST=defStore();ST.level=l;ST.theme=t;save();RS=0;toast('Progression réinitialisée');render();}

// ---------- Balayage et bouton retour ----------
const TABS=['home','rules','defs','exam','review'];
const PARENT={topic:'rules',deflist:'defs',settings:'home',fiche:'rules'};
let SWIN=0,GUARD=false,IGNPOP=false;
// d = 1 : doigt vers la droite (page précédente) ; d = -1 : doigt vers la gauche (page suivante)
function swipeTarget(d){
  if(ST.level==null)return null;
  if(VIEW==='session'){if(SES&&SES.i>=SES.items.length&&d>0)return ()=>backFrom();return null;}
  if(VIEW==='exam'&&SES){if(!SES.done)return null;return d>0?()=>{SES=null;go('exam',null,true);}:()=>go('review',null,true);}
  if(PARENT[VIEW])return d>0?()=>go(PARENT[VIEW],null,true):null;
  const i=TABS.indexOf(VIEW);if(i<0)return null;
  const j=i-d;return j>=0&&j<TABS.length?()=>go(TABS[j],null,true):null;
}
// Bouton/geste « retour » du téléphone
function backAction(){
  if(ST.level==null)return null;
  if(VIEW==='session'&&SES)return ()=>SES.i>=SES.items.length?backFrom():quitSes();
  if(VIEW==='exam'&&SES)return ()=>{if(!SES.done){if(!confirmLeave())return false;clearInterval(TIMER);}SES=null;go('exam',null,true);};
  if(PARENT[VIEW])return ()=>go(PARENT[VIEW],null,true);
  if(VIEW!=='home')return ()=>go('home',null,true);
  return null;
}
function needGuard(){return ST.level!=null&&(VIEW!=='home'||!!SES);}
function syncGuard(){try{
  if(needGuard()&&!GUARD){history.pushState({rg:1},'');GUARD=true;}
  else if(!needGuard()&&GUARD){GUARD=false;IGNPOP=true;history.back();}
}catch(e){}}
try{window.addEventListener('popstate',()=>{if(IGNPOP){IGNPOP=false;return;}GUARD=false;const f=backAction();if(f){SWIN=1;if(f()===false)SWIN=0;}syncGuard();});}catch(e){}
(function(){
  let t=null,sx=0,sy=0,st=0,dec=false,drag=false,el=null;
  const hScroll=n=>{for(;n&&n!==document.body;n=n.parentElement){if(n.scrollWidth>n.clientWidth+2){const o=getComputedStyle(n).overflowX;if(o==='auto'||o==='scroll')return true;}}return false;};
  const reset=()=>{if(!el)return;el.style.transition='transform .2s ease,opacity .2s';el.style.transform='';el.style.opacity='';};
  document.addEventListener('touchstart',e=>{
    t=null;if(e.touches.length!==1)return;const tg=e.target;
    if(!tg.closest||!tg.closest('#main')||tg.closest('input,textarea,select,[contenteditable],.noswipe')||hScroll(tg))return;
    if(!swipeTarget(1)&&!swipeTarget(-1))return;
    const p=e.touches[0];sx=p.clientX;sy=p.clientY;st=Date.now();dec=false;drag=false;el=$('#main');t=1;
  },{passive:true});
  document.addEventListener('touchmove',e=>{
    if(!t)return;const p=e.touches[0],dx=p.clientX-sx,dy=p.clientY-sy;
    if(!dec){if(Math.abs(dx)<12&&Math.abs(dy)<12)return;dec=true;if(Math.abs(dx)<Math.abs(dy)*1.4){t=null;return;}drag=true;}
    const k=swipeTarget(dx>0?1:-1)?1:.22,x=dx*k;
    el.style.transition='none';el.style.transform='translateX('+x+'px)';el.style.opacity=String(1-Math.min(.45,Math.abs(x)/innerWidth*.9));
  },{passive:true});
  document.addEventListener('touchend',e=>{
    if(!t||!drag){t=null;return;}t=null;
    const p=e.changedTouches[0],dx=p.clientX-sx,dy=p.clientY-sy,v=Math.abs(dx)/Math.max(1,Date.now()-st),d=dx>0?1:-1,f=swipeTarget(d);
    const ok=f&&Math.abs(dx)>Math.abs(dy)&&(Math.abs(dx)>Math.min(110,innerWidth*.28)||(v>.45&&Math.abs(dx)>45));
    if(!ok){reset();return;}
    el.style.transition='transform .15s ease-in,opacity .15s';el.style.transform='translateX('+(d*innerWidth*.6)+'px)';el.style.opacity='0';
    const old=el;setTimeout(()=>{SWIN=d;const r=f();if(r===false||document.contains(old)){SWIN=0;el=old;reset();}},140);
  },{passive:true});
  document.addEventListener('touchcancel',()=>{if(t&&drag)reset();t=null;},{passive:true});
})();

// ---------- Clavier ----------
document.addEventListener('keydown',e=>{
  if(!SES||(VIEW!=='session'&&VIEW!=='exam'))return;
  const tag=(e.target.tagName||'').toLowerCase();
  if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();if(VIEW==='session'){if(SES.st==='show')nextItem();else checkItem();}else if(SES.phase==='run'){SES.i+1<SES.items.length?exNav(1):exFinish();}return;}
  if(tag==='textarea'||tag==='input'||tag==='select')return;
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(VIEW==='session'&&e.key==='Enter'){e.preventDefault();if(SES.st==='show')nextItem();else checkItem();return;}
  if(VIEW==='exam'&&SES.phase==='run'){if(e.key==='ArrowRight'&&SES.i+1<SES.items.length){exNav(1);return;}if(e.key==='ArrowLeft'&&SES.i){exNav(-1);return;}}
  const inRun=VIEW==='session'?SES.st!=='show':SES.phase==='run';if(!inRun)return;
  const it=SES.items[SES.i];if(!it)return;const k=e.key.toLowerCase();
  if(it.type==='q'&&it.q.t==='tf'){if(k==='v'||k==='1')setAns(true);else if(k==='f'||k==='2')setAns(false);return;}
  const n=parseInt(e.key,10);if(!(n>=1&&n<=9))return;
  if(it.type==='q'&&(it.q.t==='qcu'||it.q.t==='qcm')&&it.q._ord&&it.q._ord[n-1]!=null)setAns(it.q._ord[n-1]);
  else if(it.type==='def'&&it.mode==='match'&&it.opts&&it.opts[n-1])setAns(it.opts[n-1].id);
  else if(it.type==='def'&&it.mode==='cards'&&SES.st==='show'&&n<=3)rateCard([0,.5,1][n-1]);
});
render();
</script><script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}</script></body></html>
