<style>:root{--sigc:#1B2A4A;--sigs:#e0b48f;--sigl:#1B2A4A;--sigj:#003DA5;--sigsh:rgba(0,0,0,.1);--blue:#003DA5;--navy:#1B2A4A;--red:#E4002B;--gold:#C8A951;--bg:#F0F2F6;--card:#FFFFFF;--card2:#F7F8FB;--tx:#1a1a1a;--txm:#5b6472;--txl:#9ca3af;--ok:#16a34a;--okbg:#e8f6ee;--err:#dc2626;--errbg:#fdecec;--warn:#ea580c;--warnbg:#fff2e8;--brd:#e5e7eb;--acc:#003DA5;--accbg:#e6edf8;--shadow:0 1px 3px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04);--r:14px}
[data-theme=dark]{--sigc:#c9d4ea;--sigl:#8193b8;--sigj:#3d6fd9;--sigsh:rgba(255,255,255,.08);--bg:#0d1320;--card:#162033;--card2:#1c2840;--tx:#e8ecf3;--txm:#a3adbf;--txl:#6b7690;--brd:#26334d;--okbg:#10301f;--errbg:#3a1518;--warnbg:#3a2412;--accbg:#1a2b4d;--acc:#6f9cff;--shadow:none}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font:inherit;color:var(--tx);background:var(--card);border:1.5px solid var(--brd);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:110px;resize:vertical;line-height:1.45}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--acc)}
.app{max-width:760px;margin:0 auto;padding-bottom:84px;min-height:100vh}
/* header */
.hdr{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;padding:14px 18px 14px;position:relative;overflow:hidden}
.hdr:after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;border:18px solid rgba(255,255,255,.06)}
.hdr-row{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.hdr-logo{width:46px;height:46px;flex:none;object-fit:contain}
.hdr-t{font-weight:800;font-size:17px;letter-spacing:.2px}
.hdr-s{font-size:11.5px;opacity:.78}
.hdr-btn{margin-left:auto;width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.12);display:grid;place-items:center}
.hdr-btn svg{width:20px;height:20px}
.tricolor{height:4px;background:linear-gradient(90deg,var(--blue) 33%,#fff 33% 66%,var(--red) 66%)}
.wrap{padding:16px}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--brd);display:flex;justify-content:center;z-index:20}
.nav-in{display:flex;max-width:760px;width:100%}
.nav button{flex:1;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--txl);font-weight:600}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--acc)}
/* cards */
.card{background:var(--card);border:1px solid var(--brd);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.h1{font-size:21px;font-weight:800;margin-bottom:4px}
.h2{font-size:16px;font-weight:800;margin:20px 0 10px;display:flex;align-items:center;gap:8px}
.h2 small{font-weight:600;color:var(--txl);font-size:12px;margin-left:auto}
.muted{color:var(--txm)}.small{font-size:13px}.tiny{font-size:11.5px}
.row{display:flex;gap:10px;align-items:center}.wrapf{flex-wrap:wrap}
.grow{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:12px;font-weight:700;background:var(--acc);color:#fff;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn.sec{background:var(--accbg);color:var(--acc)}
.btn.ghost{background:transparent;border:1.5px solid var(--brd);color:var(--tx)}
.btn.red{background:var(--red)}.btn.ok{background:var(--ok)}
.btn.block{width:100%}
.btn svg{width:18px;height:18px;flex:none}
#main{padding-bottom:30px}
.btn:disabled{opacity:.45;cursor:default}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--accbg);color:var(--acc)}
.chip.lv{color:#fff}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;background:var(--card2);color:var(--txm);border:1px solid var(--brd)}
/* hero */
.hero{border-radius:18px;padding:18px;color:#fff;position:relative;overflow:hidden;margin-bottom:14px}
.hero .lvl{font-size:12px;font-weight:700;opacity:.9;text-transform:uppercase;letter-spacing:.8px}
.hero .big{font-size:24px;font-weight:800;line-height:1.2;margin:6px 0 2px}
.hero .chg{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.18);color:#fff;padding:6px 10px;border-radius:9px;font-size:12px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{background:rgba(255,255,255,.14);border-radius:12px;padding:10px}
.stat b{display:block;font-size:20px;line-height:1.1}
.stat span{font-size:11.5px;opacity:.85}
.cta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.cta .btn{padding:14px 10px;flex-direction:column;gap:2px;border-radius:14px}
.cta .btn small{font-weight:600;opacity:.8;font-size:11.5px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tile{background:var(--card);border:1px solid var(--brd);border-radius:14px;padding:14px 12px;text-align:left;box-shadow:var(--shadow)}
.tile .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--accbg);color:var(--acc);margin-bottom:8px}
.tile .ic svg{width:19px;height:19px}
.tile b{display:block;font-size:14px}
.tile span{font-size:11.5px;color:var(--txm)}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.mcell{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:14px;border:1px solid var(--brd);position:relative}
.mcell i{position:absolute;bottom:3px;left:5px;right:5px;height:3px;border-radius:2px;background:rgba(0,0,0,.08)}
.mcell i u{display:block;height:100%;border-radius:2px;background:currentColor}
.mrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.mrow button{padding:6px 10px;border-radius:9px;border:1px solid var(--brd);font-size:12px;font-weight:700;background:var(--card)}
.legend{display:flex;gap:12px;font-size:11px;color:var(--txm);margin-top:8px}

.setprog b{display:block;font-size:16px}.setprog small{font-size:12.5px;opacity:.85}.sp-ic{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;flex:none}.sp-ic svg{width:24px;height:24px}

.sancbox{margin-top:14px;padding-top:12px;border-top:1.5px dashed var(--brd)}.sanc-t{font-weight:800;font-size:15px;margin-bottom:8px}
.sancopts{display:flex;flex-wrap:wrap;gap:6px}.schip{padding:9px 12px;border-radius:12px;border:1.5px solid var(--brd);background:var(--card);color:var(--tx);font-size:14px;font-weight:600;cursor:pointer}
.schip.sel{border-color:var(--acc);background:var(--accbg);color:var(--acc)}.schip.good{border-color:var(--ok);background:var(--okbg);color:var(--ok)}.schip.bad{border-color:var(--err);background:var(--errbg);color:var(--err)}
.sancbox.need .sanc-t{color:var(--err)}

.defi-th{display:inline-block;margin-top:4px;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.18);font-size:12.5px;font-weight:700}

.mcell.val{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}.mcell em{position:absolute;top:-6px;right:-6px;width:17px;height:17px;border-radius:50%;background:var(--ok);color:#fff;font-style:normal;font-size:10.5px;display:grid;place-items:center;font-weight:900}
.valcount{font-size:12px;font-weight:800;color:var(--ok);background:var(--okbg);padding:2px 8px;border-radius:999px;vertical-align:middle;margin-left:4px}
.vchk{color:var(--ok)}
.valbox{display:flex;gap:10px;align-items:center;margin:10px 0 4px;padding:10px 12px;border-radius:12px;background:var(--card2);border:1px solid var(--brd)}.valbox b{display:block;font-size:14px}.valbox span{font-size:12.5px;color:var(--txm)}
.valbox.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}.valbox.ok svg{width:26px;height:26px;flex:none}.valbox.ok span{color:var(--tx)}
.valbar{flex:none;width:46px;height:46px;border-radius:50%;background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--brd) 0);display:grid;place-items:center}.valbar span{width:36px;height:36px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-size:11px!important;font-weight:800;color:var(--tx)!important}

/* ---------- Formation ligue / espace formateur (1.2.0) ---------- */
.hdr-sw{margin-left:auto;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 11px;border-radius:99px;background:rgba(255,255,255,.14);color:#fff;font-size:12.5px;font-weight:700;white-space:nowrap}
.hdr-sw svg{width:15px;height:15px}.hdr-sw+.hdr-btn{margin-left:8px}
.chhello{font-size:24px;font-weight:800;margin:6px 0 2px}
.chcard{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:18px 16px;margin-bottom:12px;border-radius:18px;border:1px solid var(--brd);background:var(--card);color:var(--tx);box-shadow:var(--shadow);cursor:pointer;font:inherit}
.chcard.lg{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;border:0}
.chic{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--accbg);color:var(--acc)}.chcard.lg .chic{background:rgba(255,255,255,.16);color:#fff}.chic svg{width:26px;height:26px}
.chtx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.chtx b{font-size:18px}.chtx small{font-size:13px;opacity:.8}
.chbs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chb{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--accbg);color:var(--acc)}
.chcard.lg .chb{background:rgba(255,255,255,.18);color:#fff}.chcard.lg .chb.warn{background:#fff3d6;color:#8a5a00}.chcard.lg .chb.ok{background:#dcf5e3;color:#11632f}
.chgo{font-size:28px;opacity:.6;flex:none}
.lgform{display:flex;align-items:center;gap:14px}.lgform .lvbadge{width:48px;height:48px;font-size:13px;flex:none}
.lgtr{display:flex;align-items:center;gap:12px;padding:6px 0}.lgtr+.lgtr{border-top:1px solid var(--brd)}
.lgav{width:36px;height:36px;border-radius:50%;background:var(--accbg);color:var(--acc);display:grid;place-items:center;font-weight:800;flex:none}
.lgempty{display:flex;gap:12px;align-items:flex-start}.lgempty>svg{width:24px;height:24px;flex:none;color:var(--txm);margin-top:2px}
.lgup{display:flex;gap:12px;align-items:center;padding:14px;border-radius:14px;background:var(--okbg);border:1px solid var(--ok);margin-bottom:14px}.lgup>svg{width:28px;height:28px;color:var(--ok);flex:none}
.tfilters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}.tsel,.tsearch{padding:9px 10px;border-radius:10px;border:1px solid var(--brd);background:var(--card);color:var(--tx);font:inherit;font-size:14px}
.tsearch{flex:1;min-width:150px}.tref{padding:9px 12px;flex-direction:row}
.tkpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:6px}.tkpis>div{background:var(--card);border:1px solid var(--brd);border-radius:14px;padding:12px 14px}.tkpis b{display:block;font-size:22px}.tkpis span{font-size:12.5px;color:var(--txm)}
.tbar{display:flex;align-items:center;gap:10px;padding:4px 0;font-size:13.5px}.tb-l{flex:0 0 46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tb-b{flex:1;height:8px;border-radius:99px;background:var(--brd);overflow:hidden}.tb-b i{display:block;height:100%;border-radius:99px}.tb-v{flex:0 0 46px;text-align:right;font-weight:700}
.ttable-wrap{padding:0;overflow-x:auto}.ttable{width:100%;border-collapse:collapse;font-size:13.5px;min-width:620px}
.ttable th{text-align:left;font-size:12px;color:var(--txm);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--brd);white-space:nowrap}
.ttable td{padding:9px 12px;border-bottom:1px solid var(--brd);vertical-align:middle}.ttable tr:last-child td{border-bottom:0}.ttable tbody tr{cursor:pointer}.ttable tbody tr:hover{background:var(--card2)}
.ttable .tsel{padding:6px 8px;font-size:13px}
.tchip{display:inline-block;color:#fff;font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:99px}
.tnivrow{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-end}.tnivrow .tsel{margin-top:4px}
.tkvs{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px}.tkv{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--brd);font-size:13.5px}.tkv span{color:var(--txm)}
@media (min-width:700px){.tkpis{grid-template-columns:repeat(4,1fr)}}

.tfilters .tsel{width:auto;flex:0 0 auto}.tnivrow .tsel{width:auto}.ttable .tsel{width:auto;min-width:130px}
.ttable td:first-child{min-width:140px}

/* menu des espaces (1.2.0) */
.hdr-s{white-space:normal!important;overflow:visible!important;text-overflow:clip!important;line-height:1.35}
.hdr-sp{position:relative;z-index:1;margin-top:10px}
.spbtn{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:10px;background:rgba(255,255,255,.14);color:#fff;font-size:13.5px;font-weight:700;border:0;cursor:pointer;font-family:inherit}
.spbtn svg{width:16px;height:16px}.spcar{font-size:11px;opacity:.8;margin-left:2px}
.spmenu{position:absolute;z-index:60;min-width:260px;max-width:calc(100vw - 20px);background:var(--card);color:var(--tx);border:1px solid var(--brd);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:6px}
.spmenu button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px;border:0;border-radius:10px;background:none;color:var(--tx);font:inherit;cursor:pointer}
.spmenu button:hover,.spmenu button.on{background:var(--card2)}.spmenu button svg{width:20px;height:20px;flex:none;color:var(--acc)}
.spmenu span{flex:1;display:flex;flex-direction:column}.spmenu b{font-size:14px}.spmenu small{font-size:12px;color:var(--txm)}.spmenu i{font-style:normal;color:var(--acc);font-weight:800}

<style>
#splash{position:fixed;inset:0;z-index:9999;background:radial-gradient(circle at 50% 42%,#24365e 0,#1B2A4A 62%);display:flex;align-items:center;justify-content:center;animation:spOut .5s ease-in 2.2s forwards}
.sp-in{position:relative;display:flex;flex-direction:column;align-items:center;margin-top:-6vh}
.sp-logo{width:150px;height:auto;position:relative;z-index:2;transform-origin:42% 60%;animation:spPop 1s cubic-bezier(.2,1.4,.4,1) both,spBlow .4s ease-in-out 1.05s 2}
.sp-ring{position:absolute;top:70px;left:50%;width:140px;height:140px;margin:-70px 0 0 -70px;border-radius:50%;border:2px solid rgba(255,255,255,.55);opacity:0;animation:spRing 1.3s ease-out .8s forwards}
.sp-ring.r2{border-color:rgba(228,0,43,.6);animation-delay:1.15s}.sp-ring.r3{animation-delay:1.5s}
.sp-name{margin-top:22px;color:#fff;font:800 30px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;letter-spacing:.5px;opacity:0;animation:spUp .6s ease-out .95s forwards}
.sp-bar{display:flex;gap:4px;margin-top:14px;height:4px}.sp-bar i{display:block;height:4px;width:0;border-radius:2px;animation:spBar .55s ease-out forwards}
.sp-bar i:nth-child(1){background:#003DA5;animation-delay:1.3s}.sp-bar i:nth-child(2){background:#fff;animation-delay:1.45s}.sp-bar i:nth-child(3){background:#E4002B;animation-delay:1.6s}
@keyframes spPop{0%{opacity:0;transform:scale(.35) rotate(-40deg)}60%{opacity:1;transform:scale(1.08) rotate(6deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes spBlow{0%,100%{transform:rotate(0)}30%{transform:rotate(-5deg) scale(1.03)}70%{transform:rotate(4deg)}}
@keyframes spRing{0%{opacity:.9;transform:scale(.7)}100%{opacity:0;transform:scale(2.1)}}
@keyframes spUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes spBar{to{width:34px}}
@keyframes spOut{to{opacity:0;transform:scale(1.04);visibility:hidden}}
@media (prefers-reduced-motion:reduce){#splash{animation:spOut .3s ease-in .7s forwards}.sp-logo,.sp-name{animation:none;opacity:1}.sp-ring{display:none}.sp-bar i{animation:none;width:34px}}
</style>

const APPV='1.2.0';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LOGO='<img class="hdr-logo" src="'+LOGO_PNG+'" alt="Avantage">';
const KK='avantage_k';
function getK(){try{return localStorage.getItem(KK);}catch(e){return null;}}
function setK(k){try{k?localStorage.setItem(KK,k):localStorage.removeItem(KK);}catch(e){}}
function grender(){if(typeof render==='function')render();else bootRender();}
function gmsg(m){if(typeof toast==='function')toast(m);}
const GATE=(typeof window!=='undefined'&&window.GATE_URL)?window.GATE_URL:null;
const LICK='avantage_lic',DEVK='avantage_dev',GRACE=30*864e5,RECHECK=6*36e5;
let LIC=null,GSTATE=null,GMSG='',GBUSY=false,DEFERRED=null;
try{LIC=JSON.parse(localStorage.getItem(LICK)||'null');}catch(e){LIC=null;}
function devId(){let d=null;try{d=localStorage.getItem(DEVK);}catch(e){}if(!d){d='D'+Date.now().toString(36)+Math.random().toString(36).slice(2,10);try{localStorage.setItem(DEVK,d);}catch(e){}}return d;}
function licSave(){try{LIC?localStorage.setItem(LICK,JSON.stringify(LIC)):localStorage.removeItem(LICK);}catch(e){}}
function isPhone(){const u=navigator.userAgent||'';return /iPhone|iPod/i.test(u)||(/Android/i.test(u)&&/Mobile/i.test(u));}
function isStandalone(){try{return matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches||navigator.standalone===true;}catch(e){return false;}}
function isIOS(){return /iPhone|iPod|iPad/i.test(navigator.userAgent||'');}
try{addEventListener('beforeinstallprompt',e=>{e.preventDefault();DEFERRED=e;if(GSTATE==='install')grender();});}catch(e){}
function isTrainer(){return !!(LIC&&LIC.ok&&['fs','fl','mod'].includes(LIC.role));}
function licInfo(r){if(!LIC||!r)return;['role','sect','niv','form','tr'].forEach(k=>{if(k in r)LIC[k]=r[k];});}
function gateState(){
  if(!GATE)return 'ok';
  if(isPhone()){if(!isStandalone())return 'install';}
  else if(LIC&&LIC.ok&&!isTrainer())return 'desktop';
  if(!LIC||!LIC.ok)return 'key';
  if(Date.now()-(LIC.last||0)>GRACE&&!navigator.onLine)return 'offline';
  return 'ok';
}
const GERR={unknown:"Cette clé n'existe pas. Vérifie qu'elle est recopiée sans erreur.",used:"Cette clé a déjà été activée sur un autre téléphone. Chaque clé ne fonctionne que sur un seul appareil.",revoked:"L'accès de cette clé a été coupé. Contacte la personne qui te l'a donnée.",device:"Cette clé n'est plus associée à cet appareil. Saisis une nouvelle clé.",phone:"Les clés d'arbitre ne fonctionnent que sur téléphone. Sur ordinateur, seuls les formateurs et administrateurs peuvent se connecter.",used2:"Cette clé est déjà activée sur le nombre maximum d'appareils. Demande à la personne qui te l'a donnée de libérer un appareil.",full:"Cette clé est déjà activée sur le nombre maximum d'appareils. Demande à la personne qui te l'a donnée de libérer un appareil.",param:"Clé incomplète.",net:"Impossible de joindre le serveur. Vérifie ta connexion Internet puis réessaie."};
function gateCall(action,key,extra){
  const m=isPhone()?(/iPhone/i.test(navigator.userAgent)?'iPhone':'Android'):'Ordinateur';
  const u=GATE+(GATE.includes('?')?'&':'?')+'action='+action+'&key='+encodeURIComponent(key)+'&dev='+encodeURIComponent(devId())+'&m='+encodeURIComponent(m)+'&ph='+(isPhone()?1:0)+(extra!=null?extra:progParam());
  return fetch(u,{redirect:'follow',cache:'no-store'}).then(r=>r.json());
}
function fmtKey(v){const s=String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'');const m=s.match(/^(AVTG|ARB|FORM|MOD)?(.*)$/);const g=(m[2]||'').match(/.{1,4}/g);return g?(m[1]||'AVTG')+'-'+g.slice(0,3).join('-'):'';}
function gateActivate(){
  if(GBUSY)return;const inp=document.getElementById('gkey');const key=fmtKey(inp&&inp.value);
  if(!/^[A-Z]+-[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(key)){GMSG=GERR.param;grender();return;}
  GBUSY=true;GMSG='';grender();
  gateCall('activate',key).then(r=>{GBUSY=false;
    if(r&&r.ok){LIC={key,name:r.name||'',ok:true,last:Date.now(),since:Date.now(),dAt:Date.now(),defi:r.d||null};licInfo(r);licSave();if(r.k)setK(r.k);GMSG='';if(typeof go==='function')VIEW=rootView();if(typeof formSync==='function')formSync();grender();gmsg('Application activée'+(r.name?' — '+r.name:''));}
    else{GMSG=GERR[(r&&r.err)]||GERR.unknown;grender();}
  }).catch(()=>{GBUSY=false;GMSG=GERR.net;grender();});
}
function progParam(){try{if(typeof progSummary!=='function'||!ST||ST.level==null)return '';return '&p='+encodeURIComponent(JSON.stringify(progSummary()));}catch(e){return '';}}
// Envoi anticipé après une série ou un examen (au plus toutes les 30 min)
function gateSync(){if(!GATE||!LIC||!LIC.ok||!navigator.onLine)return;if(Date.now()-(LIC.sync||0)<18e5)return;LIC.sync=Date.now();licSave();gateCheck(true);}
function gateCheck(force){
  if(!GATE||!LIC||!LIC.ok||!navigator.onLine)return Promise.resolve(null);
  if(!force&&Date.now()-(LIC.last||0)<RECHECK)return Promise.resolve(null);
  return gateCall('check',LIC.key).then(r=>{
    if(r&&r.ok){LIC.last=Date.now();LIC.sync=Date.now();LIC.dAt=Date.now();if(r.name!=null)LIC.name=r.name;if(r.k)setK(r.k);if('d' in r)LIC.defi=r.d||null;licInfo(r);licSave();if(typeof formSync==='function')formSync();if(typeof defiFlush==='function')defiFlush();if(typeof render==='function'&&['home','choice','ligue'].includes(VIEW)&&!SES&&!document.getElementById('tuto')&&!document.getElementById('news'))render();}
    else if(r&&['revoked','used','device','unknown'].includes(r.err)){LIC={ok:false,lastErr:r.err};licSave();setK(null);GMSG=GERR[r.err];if(typeof render==='function'){render();}else bootRender();}
    return r;
  }).catch(()=>null);
}

  else if(st==='loading')b=`<div style="text-align:center;padding:60px 0" class="muted">Chargement…</div>`;
  else if(st==='needk')b=`<div class="h1">Connexion nécessaire</div><p class="muted">Cette version de l'application doit être déverrouillée une première fois avec une connexion Internet. Ta clé n'est pas à ressaisir.</p>${GMSG?`<div class="small" style="color:var(--err);margin-bottom:10px">${esc(GMSG)}</div>`:''}<button class="btn block" onclick="GMSG='';bootRender()">Réessayer</button>`;
  else b=`<div class="h1">${isPhone()?'Activer Avantage':'Espace formateur'}</div>${isPhone()?`<p class="muted">Saisis la clé personnelle que tu as reçue. Elle ne fonctionne que sur <b>un seul téléphone</b> : une fois activée ici, elle ne pourra plus être utilisée ailleurs.</p>`:`<p class="muted">Sur ordinateur, Avantage est réservée aux <b>formateurs et administrateurs</b>. Saisis ta clé personnelle : elle peut être activée sur ton ordinateur et sur ton téléphone.</p><div class="card small" style="margin-bottom:12px">Tu es arbitre ? Ouvre ce lien sur ton téléphone pour installer l'application.</div>`}
    <div class="card"><label class="small" for="gkey" style="display:block;margin-bottom:6px">Clé d'activation</label>
    <input id="gkey" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="AVTG-XXXX-XXXX-XXXX" style="text-transform:uppercase;letter-spacing:1px;font-family:ui-monospace,monospace" onkeydown="if(event.key==='Enter')gateActivate()">
    ${GMSG?`<div class="small" style="color:var(--err);margin-top:8px">${esc(GMSG)}</div>`:''}
    <button class="btn block" style="margin-top:12px" onclick="gateActivate()" ${GBUSY?'disabled':''}>${GBUSY?'Vérification…':'Activer'}</button></div>
    <div class="tiny muted">Une connexion Internet est nécessaire pour l'activation. Ensuite, l'application fonctionne hors connexion.</div>`;
  return hd+`<div class="wrap narrow" id="main">${b}</div>`;
}

// ===== Chargeur : déchiffre l'application après vérification de la licence =====
let BOOTING=false;
function b64u8(s){const b=atob(s);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
async function decryptApp(k){
  const raw=b64u8(document.getElementById('appblob').textContent.trim());
  const key=await crypto.subtle.importKey('raw',b64u8(k),'AES-GCM',false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:raw.slice(0,12)},key,raw.slice(12));
  return new TextDecoder().decode(pt);
}
async function fetchK(){
  const r=await gateCall('check',LIC.key);
  if(r&&r.ok&&r.k){LIC.last=Date.now();if(r.name!=null)LIC.name=r.name;licInfo(r);licSave();setK(r.k);return r.k;}
  if(r&&r.ok){GMSG="Le registre des clés n'est pas à jour (script Google). Préviens la personne qui t'a donné ta clé.";return null;}
  if(r&&r.err){LIC={ok:false,lastErr:r.err};licSave();setK(null);GMSG=GERR[r.err]||'';return 'locked';}
  return null;
}
async function startApp(){
  if(BOOTING)return;BOOTING=true;const el=document.getElementById('app');
  try{
    let k=getK(),fresh=false;
    if(!k){try{k=await fetchK();fresh=true;}catch(e){k=null;GMSG=GERR.net;}
      if(k==='locked'){BOOTING=false;bootRender();return;}
      if(!k){BOOTING=false;el.innerHTML=gateView('needk');return;}}
    let code;
    try{code=await decryptApp(k);}
    catch(e){ // clé de contenu changée : on la redemande une fois
      setK(null);if(fresh){throw e;}
      try{k=await fetchK();}catch(e2){k=null;GMSG=GERR.net;}
      if(k==='locked'){BOOTING=false;bootRender();return;}
      if(!k){BOOTING=false;el.innerHTML=gateView('needk');return;}
      code=await decryptApp(k);
    }
    const s=document.createElement('script');s.textContent=code;document.body.appendChild(s);
  }catch(e){BOOTING=false;GMSG="Impossible d'ouvrir cette version. Réessaie avec une connexion Internet.";el.innerHTML=gateView('needk');}
}
function bootRender(){
  if(typeof render==='function'){render();return;}
  const st=gateState(),el=document.getElementById('app');el.className='app nonav';
  if(st!=='ok'){const v=document.getElementById('gkey')&&document.getElementById('gkey').value;el.innerHTML=gateView(st);if(v&&document.getElementById('gkey'))document.getElementById('gkey').value=v;return;}
  el.innerHTML=gateView('loading');startApp();
}
bootRender();
